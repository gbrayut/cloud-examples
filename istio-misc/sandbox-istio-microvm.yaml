# Using istio-init on GKE Sandbox (microvm). See istio-misc/sandbox-istio.md for more details.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-istio-init-microvm
  namespace: test-istio
  labels:
    app: sandbox-istio-init-microvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-istio-init-microvm
  template:
    metadata:
      annotations:
        inject.istio.io/templates: "kata-init,sidecar"
      labels:
        app: sandbox-istio-init-microvm
    spec:
      runtimeClassName: microvm  # GKE Sandbox settings
      terminationGracePeriodSeconds: 0    # terminates immediately when testing (dont use in production)
      containers:
      - image: busybox
        name: busybox
        command: ["sleep"]
        args: ["infinity"]
