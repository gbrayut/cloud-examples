# Using Istio CNI and istio-validation on GKE Sandbox (gvisor). See istio-misc/sandbox-istio.md for more details.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-istio-gvisor
  namespace: test-istio
  labels:
    app: sandbox-istio-gvisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-istio-gvisor
  template:
    metadata:
      labels:
        app: sandbox-istio-gvisor
    spec:
      runtimeClassName: gvisor  # GKE Sandbox settings
      terminationGracePeriodSeconds: 0    # terminates immediately when testing (do not use in production)
      containers:
      - image: busybox
        name: busybox
        command: ["sleep"]
        args: ["infinity"]
